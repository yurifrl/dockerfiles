name: Docker Push

on:
  push:

jobs:
  find-dockerfiles:
    runs-on: ubuntu-24.04-arm
    outputs:
      dirs: ${{ steps.set-dirs.outputs.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Find directories with Dockerfiles
        id: set-dirs
        run: |
          DIRS=$(find . -name Dockerfile -type f -not -path "*/\.*" | xargs -n1 dirname | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dirs=$DIRS" >> $GITHUB_OUTPUT

  build-and-push:
    needs: find-dockerfiles
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        dir: ${{ fromJson(needs.find-dockerfiles.outputs.dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract directory name for image tag
        id: dirname
        run: echo "name=$(basename ${{ matrix.dir }})" >> $GITHUB_OUTPUT
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ steps.dirname.outputs.name }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} 